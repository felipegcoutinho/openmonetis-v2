name: ${OPENMONETIS_PROJECT_NAME:-openmonetis}

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openmonetis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmonetis}
      POSTGRES_USER: ${POSTGRES_USER:-openmonetis}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-7000}:5432"
    volumes:
      - OMv2_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    restart: "no"
    image: "${OPENMONETIS_IMAGE_NAMESPACE:-ghcr.io/felipegcoutinho}/openmonetis-migrator:${OPENMONETIS_VERSION:-latest}"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-openmonetis}:${POSTGRES_PASSWORD:-openmonetis}@db:5432/${POSTGRES_DB:-openmonetis}}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: "${OPENMONETIS_IMAGE_NAMESPACE:-ghcr.io/felipegcoutinho}/openmonetis-api:${OPENMONETIS_VERSION:-latest}"
    restart: unless-stopped
    init: true
    environment:
      AUTH_SESSION_EXPIRES_IN_DAYS: ${AUTH_SESSION_EXPIRES_IN_DAYS:-30}
      AUTH_SESSION_UPDATE_AGE_HOURS: ${AUTH_SESSION_UPDATE_AGE_HOURS:-24}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${OPENMONETIS_URL:-http://localhost:7002}}
      CORS_ORIGIN: ${CORS_ORIGIN:-${OPENMONETIS_URL:-http://localhost:7002}}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-openmonetis}:${POSTGRES_PASSWORD:-openmonetis}@db:5432/${POSTGRES_DB:-openmonetis}}
      DEVICE_TOKEN_SECRET: ${DEVICE_TOKEN_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOGO_DEV_PUBLISHABLE_KEY: ${LOGO_DEV_PUBLISHABLE_KEY:-}
      LOGO_DEV_SECRET_KEY: ${LOGO_DEV_SECRET_KEY:-}
      PERSON_CONNECTION_SECRET: ${PERSON_CONNECTION_SECRET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      WEB_URL: ${WEB_URL:-${OPENMONETIS_URL:-http://localhost:7002}}
    depends_on:
      migrator:
        condition: service_completed_successfully

  recurring-worker:
    image: "${OPENMONETIS_IMAGE_NAMESPACE:-ghcr.io/felipegcoutinho}/openmonetis-api:${OPENMONETIS_VERSION:-latest}"
    restart: unless-stopped
    init: true
    command:
      - node
      - --import
      - tsx
      - src/scripts/recurring-external-expenses.worker.ts
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-openmonetis}:${POSTGRES_PASSWORD:-openmonetis}@db:5432/${POSTGRES_DB:-openmonetis}}
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    image: "${OPENMONETIS_IMAGE_NAMESPACE:-ghcr.io/felipegcoutinho}/openmonetis-web:${OPENMONETIS_VERSION:-latest}"
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: http://api:7001
      S3_ENDPOINT: ${S3_ENDPOINT:-}
    ports:
      - "${APP_PORT:-7002}:7002"
    depends_on:
      api:
        condition: service_healthy

volumes:
  OMv2_db:
