name: Publish container images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag, packages and changelog
        run: |
          git fetch origin main
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/validate-release.mjs --tag "$GITHUB_REF_NAME"

  quality:
    name: Validate release source
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }} (${{ matrix.platform.arch }})
    needs:
      - release-metadata
      - quality
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - web
          - migrator
          - ai
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openmonetis-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/openmonetis-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.target }} manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - web
          - migrator
          - ai

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.target }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openmonetis-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openmonetis-${{ matrix.target }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            sources+=("$IMAGE@sha256:$digest")
          done
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tags+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Verify published platforms
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openmonetis-${{ matrix.target }}
        run: |
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]
          '

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[(Unreleased|[0-9]+\.)/ { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started=1; print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
